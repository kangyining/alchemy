# Merge into the server { } or location / that proxy_passes to report-agents.
#
# If you see: 413 Request Entity Too Large ... nginx/1.x — nginx dropped the body
# before the backend. Default client_max_body_size is 1m.
#
# Cloud Run: with --use-http2, request bodies are not subject to the 32 MiB
# HTTP/1 limit (see Cloud Run quotas). Without HTTP/2 to the container, keep
# uploads under 32 MiB or enable --use-http2 on the service.

client_max_body_size 64m;

proxy_read_timeout 600s;
proxy_send_timeout 600s;
proxy_connect_timeout 60s;
