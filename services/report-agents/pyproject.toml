[project]
name = "report-agents"
version = "0.1.0"
description = "Multi-agent financial report generator using Google ADK"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.0.0",
    "google-cloud-documentai>=2.20",
    "google-cloud-documentai-toolbox>=0.13.0a0",
    "google-genai>=1.0.0",
    "cairosvg>=2.7",
    "pandas>=2.0",
    "numba<0.63.0",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "python-pptx>=0.6.23",
    "weasyprint>=60",
    "markdown>=3.5",
    "Jinja2>=3.1",
    "pypdf>=4.0",
    "hypercorn>=0.18.0",
    "google-cloud-storage>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
include = ["report_agents*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
