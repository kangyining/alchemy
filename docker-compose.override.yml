services:
  api:
    image: elixir-chat:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - REPORT_AGENT_URL=http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ./librechat.yaml
        target: /app/librechat.yaml
      - type: bind
        source: ./api/data/auth.json
        target: /app/api/data/auth.json
      - type: bind
        source: ./pdf-output
        target: /app/pdf-output
      - type: bind
        source: ./mcp-servers
        target: /app/mcp-servers
