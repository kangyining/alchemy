services:
  api:
    image: elixir-chat:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - type: bind
        source: ./librechat.yaml
        target: /app/librechat.yaml
      - type: bind
        source: ./api/data/auth.json
        target: /app/api/data/auth.json
      - type: bind
        source: ./pdf-output
        target: /app/pdf-output
      - type: bind
        source: ./mcp-servers
        target: /app/mcp-servers
  client:
    image: node:20-bullseye
    working_dir: /app
    command: sh -c "npm install && npm run build:data-provider && npm run build:data-schemas && npm run build:client-package && cd client && npx vite --host 0.0.0.0 --port 3090"
    ports:
      - "3090:3090"
    environment:
      - HOST=api
      - BACKEND_PORT=3080
      - PORT=3090
      - REPORT_AGENT_PROXY_TARGET=http://host.docker.internal:8000
      - VITE_ALLOWED_HOSTS=localhost,127.0.0.1,host.docker.internal
    volumes:
      - type: bind
        source: .
        target: /app
      - node_modules:/app/node_modules
    depends_on:
      - api
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  node_modules:
